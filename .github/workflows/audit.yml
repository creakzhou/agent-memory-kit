name: audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  selftest:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
        include:
          # ubuntu-latest is Ubuntu 26.04, whose python-versions manifest starts
          # at 3.10 — asking for 3.9 fails in setup-python, not in our code.
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile every script
        run: python -m compileall -q scripts

      # The same command a contributor runs locally. It scaffolds a vault in a
      # temp dir, audits it, injects one defect at a time, and requires the
      # matching check to fail. A green run therefore proves the linters work.
      - name: Self-test (clean input passes, dirty input fails)
        run: python scripts/selftest.py

      - name: Audit the shipped example vault
        run: python scripts/check_all.py --config examples/memory.config.json --vault examples/demo-vault

      - name: Probe runs on this platform
        run: python scripts/probe.py

      # The marketplace rejects a package for three reasons, all of them at
      # upload time: a missing frontmatter field, a subfolder nested more than
      # one level inside the top folder, an archive over 3 MB. Checking that
      # here means the release fails in CI instead of three weeks later in a
      # review queue.
      - name: The upload package satisfies the marketplace rules
        run: python scripts/package_skill.py --check

      # Catches the failure this repo already made once: a test that drops a temp
      # file into the working tree, or a sanitised path that crept back in.
      - name: Tests must not write into the repository
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::a script modified the working tree"
            git status --porcelain
            exit 1
          fi
